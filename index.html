<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
				<title>3D City Racing - Open Arena</title>
				<script src="https://telegram.org/js/telegram-web-app.js"></script>
				<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
				<style>
					body { margin: 0; overflow: hidden; background: #050510; font-family: sans-serif; user-select: none; }
					#ui { position: absolute; top: 10px; left: 10px; color: #fff; font-size: 18px; text-shadow: 1px 1px 2px #000; pointer-events: none; z-index: 10; display: none; }
					#controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-around; padding: 0 20px; box-sizing: border-box; z-index: 10; display: none; }
					.btn { width: 70px; height: 70px; background: rgba(255,255,255,0.2); border: 2px solid #fff; border-radius: 50%; color: #fff; font-size: 24px; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
					#nitro { background: rgba(255, 69, 0, 0.4); border-color: orange; }

					.screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 5, 16, 0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; color: #fff; text-align: center; }
					.menu-btn { padding: 15px 40px; background: #ff0055; border: none; border-radius: 30px; color: #fff; font-size: 20px; font-weight: bold; cursor: pointer; margin-top: 20px; box-shadow: 0 0 15px rgba(255,0,85,0.5); }
					.menu-btn:active { transform: scale(0.95); }
					h1 { margin: 0 0 10px 0; font-size: 32px; text-shadow: 0 0 10px #ff0055; }
					p { color: #aaa; font-size: 16px; }
				</style>
			</head>
	<body>
		<div id="start-screen" class="screen">
			<h1>CYBER ARENA</h1>
			<p>Свободная езда по ночной площадке!</p>
			<button class="menu-btn" id="start-btn">СТАРТ</button>
		</div>

		<div id="gameover-screen" class="screen" style="display: none;">
			<h1>ЗАЕЗД ОКОНЧЕН</h1>
			<p>
				Счет: <span id="final-score">0</span>
			</p>
			<button class="menu-btn" id="restart-btn">ИГРАТЬ СНОВА</button>
		</div>

		<div id="ui">
			Очки: <span id="score">0</span><br>
				Монеты: <span id="coins">0</span>
		</div>

		<div id="controls">
			<div class="btn" id="left">◀</div>
			<div class="btn" id="nitro">🔥</div>
			<div class="btn" id="right">▶</div>
		</div>

		<script>
			const tg = window.Telegram.WebApp;
			tg.expand();

			let score = 0;
			let coins = 0;
			let speed = 0.4;
			let isNitro = false;
			let gameActive = false;
			let carAngle = 0;
			let turnDirection = 0;

			const scene = new THREE.Scene();
			scene.background = new THREE.Color(0x050510);
			scene.fog = new THREE.FogExp2(0x050510, 0.02);

			const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
			const renderer = new THREE.WebGLRenderer({ antialias: true });
			renderer.setSize(window.innerWidth, window.innerHeight);
			document.body.appendChild(renderer.domElement);

			scene.add(new THREE.AmbientLight(0xffffff, 0.6));
			const dirLight = new THREE.DirectionalLight(0x00ffff, 0.8);
			dirLight.position.set(10, 20, -10);
			scene.add(dirLight);

			// Большая чистая площадка (дорожное покрытие)
			const arenaSize = 150;
			const ground = new THREE.Mesh(
			new THREE.PlaneGeometry(arenaSize, arenaSize),
			new THREE.MeshStandardMaterial({ color: 0x111118, roughness: 0.9 })
			);
			ground.rotation.x = -Math.PI / 2;
			scene.add(ground);

			// Машина-спорткар
			const carGroup = new THREE.Group();

			const body = new THREE.Mesh(
			new THREE.BoxGeometry(1.6, 0.5, 3.5),
			new THREE.MeshStandardMaterial({ color: 0xff0055, metalness: 0.8, roughness: 0.2 })
			);
			body.position.y = 0.25;
			carGroup.add(body);

			const cabin = new THREE.Mesh(
			new THREE.BoxGeometry(1.2, 0.4, 1.8),
			new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 })
			);
			cabin.position.set(0, 0.65, -0.2);
			carGroup.add(cabin);

			const lightMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
			const lightLeft = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, 0.1), lightMat);
			lightLeft.position.set(-0.5, 0.3, 1.76);
			carGroup.add(lightLeft);

			const lightRight = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, 0.1), lightMat);
			lightRight.position.set(0.5, 0.3, 1.76);
			carGroup.add(lightRight);

			carGroup.position.set(0, 0, 0);
			scene.add(carGroup);

			// Управление поворотами (исправленные обработчики)
			const leftBtn = document.getElementById('left');
			const rightBtn = document.getElementById('right');
			const nitroBtn = document.getElementById('nitro');

			// Левая кнопка: поворот в одну сторону
			leftBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); turnDirection = 1; });
			leftBtn.addEventListener('pointerup', () => turnDirection = 0);
			leftBtn.addEventListener('pointerleave', () => turnDirection = 0);

			// Правая кнопка: поворот в другую сторону
			rightBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); turnDirection = -1; });
			rightBtn.addEventListener('pointerup', () => turnDirection = 0);
			rightBtn.addEventListener('pointerleave', () => turnDirection = 0);

			nitroBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); isNitro = true; });
			nitroBtn.addEventListener('pointerup', () => isNitro = false);
			nitroBtn.addEventListener('pointerleave', () => isNitro = false);

			document.getElementById('start-btn').addEventListener('pointerdown', startGame);
			document.getElementById('restart-btn').addEventListener('pointerdown', startGame);

			function startGame() {
			document.getElementById('start-screen').style.display = 'none';
			document.getElementById('gameover-screen').style.display = 'none';
			document.getElementById('ui').style.display = 'block';
			document.getElementById('controls').style.display = 'flex';

			score = 0;
			carGroup.position.set(0, 0, 0);
			carAngle = 0;
			turnDirection = 0;
			gameActive = true;
			}

			function gameOver() {
			gameActive = false;
			document.getElementById('ui').style.display = 'none';
			document.getElementById('controls').style.display = 'none';
			document.getElementById('final-score').innerText = score;
			document.getElementById('gameover-screen').style.display = 'flex';
			tg.sendData(JSON.stringify({ score: score, coins: coins }));
			}

			function animate() {
			requestAnimationFrame(animate);

			if (gameActive) {
			let currentSpeed = isNitro ? speed * 2.2 : speed;

			// Изменяем угол поворота машины при зажатии кнопок
			carAngle += turnDirection * 0.04;
			carGroup.rotation.y = carAngle;
			carGroup.rotation.z = turnDirection * -0.15; // Наклон машины вбок

			// Едем вперед по направлению взгляда машины
			carGroup.position.x += Math.sin(carAngle) * currentSpeed;
			carGroup.position.z += Math.cos(carAngle) * currentSpeed;

			score += 1;
			document.getElementById('score').innerText = score;

			// Проверка границ площадки (если уедет слишком далеко от центра)
			if (Math.abs(carGroup.position.x) > 70 || Math.abs(carGroup.position.z) > 70) {
			gameOver();
			}

			// Плавная камера сзади машины
			const camDist = 8;
			const camHeight = 3.5;
			camera.position.x = carGroup.position.x - Math.sin(carAngle) * camDist;
			camera.position.z = carGroup.position.z - Math.cos(carAngle) * camDist;
			camera.position.y = carGroup.position.y + camHeight;
			camera.lookAt(carGroup.position.x, carGroup.position.y + 0.5, carGroup.position.z);
			}

			renderer.render(scene, camera);
			}
			animate();

			window.addEventListener('resize', () => {
			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize(window.innerWidth, window.innerHeight);
			});
		</script>
	</body>
</html>
