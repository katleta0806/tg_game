<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
				<title>3D City Racing</title>
				<script src="https://telegram.org/js/telegram-web-app.js"></script>
				<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
				<style>
					body { margin: 0; overflow: hidden; background: #050510; font-family: sans-serif; user-select: none; }
					#ui { position: absolute; top: 10px; left: 10px; color: #fff; font-size: 18px; text-shadow: 1px 1px 2px #000; pointer-events: none; z-index: 10; display: none; }
					#controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-around; padding: 0 20px; box-sizing: border-box; z-index: 10; display: none; }
					.btn { width: 70px; height: 70px; background: rgba(255,255,255,0.2); border: 2px solid #fff; border-radius: 50%; color: #fff; font-size: 24px; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
					#nitro { background: rgba(255, 69, 0, 0.4); border-color: orange; }

					/* Экраны меню и окончания игры */
					.screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 5, 16, 0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; color: #fff; text-align: center; }
					.menu-btn { padding: 15px 40px; background: #ff0055; border: none; border-radius: 30px; color: #fff; font-size: 20px; font-weight: bold; cursor: pointer; margin-top: 20px; box-shadow: 0 0 15px rgba(255,0,85,0.5); }
					.menu-btn:active { transform: scale(0.95); }
					h1 { margin: 0 0 10px 0; font-size: 32px; text-shadow: 0 0 10px #ff0055; }
					p { color: #aaa; font-size: 16px; }
				</style>
			</head>
	<body>
		<!-- Экран старта -->
		<div id="start-screen" class="screen">
			<h1>CYBER RACING</h1>
			<p>Уворачивайся от зданий, жми нитро и ставь рекорды!</p>
			<button class="menu-btn" id="start-btn">СТАРТ</button>
		</div>

		<!-- Экран проигрыша -->
		<div id="gameover-screen" class="screen" style="display: none;">
			<h1>АВАРИЯ!</h1>
			<p>
				Твой счет: <span id="final-score">0</span>
			</p>
			<button class="menu-btn" id="restart-btn">ИГРАТЬ СНОВА</button>
		</div>

		<div id="ui">
			Очки: <span id="score">0</span><br>
				Монеты: <span id="coins">0</span>
		</div>

		<div id="controls">
			<div class="btn" id="left">◀</div>
			<div class="btn" id="nitro">🔥</div>
			<div class="btn" id="right">▶</div>
		</div>

		<script>
			const tg = window.Telegram.WebApp;
			tg.expand();

			let score = 0;
			let coins = 0;
			let speed = 0.6;
			let isNitro = false;
			let gameActive = false;

			const scene = new THREE.Scene();
			scene.background = new THREE.Color(0x050510);
			scene.fog = new THREE.FogExp2(0x050510, 0.02);

			const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
			camera.position.set(0, 5, -10);

			const renderer = new THREE.WebGLRenderer({ antialias: true });
			renderer.setSize(window.innerWidth, window.innerHeight);
			document.body.appendChild(renderer.domElement);

			scene.add(new THREE.AmbientLight(0xffffff, 0.6));
			const dirLight = new THREE.DirectionalLight(0x00ffff, 0.8);
			dirLight.position.set(10, 20, -10);
			scene.add(dirLight);

			// Дорога
			const roadGeo = new THREE.PlaneGeometry(22, 3000);
			const roadMat = new THREE.MeshStandardMaterial({ color: 0x111118, roughness: 0.9 });
			const road = new THREE.Mesh(roadGeo, roadMat);
			road.rotation.x = -Math.PI / 2;
			scene.add(road);

			// Здания
			const buildings = [];
			const buildingMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.7 });
			for (let i = 0; i < 60; i++) {
            const bWidth = 3 + Math.random() * 4;
            const bHeight = 10 + Math.random() * 30;
            const bDepth = 3 + Math.random() * 4;
            const building = new THREE.Mesh(new THREE.BoxGeometry(bWidth, bHeight, bDepth), buildingMat);
            const side = i % 2 === 0 ? 1 : -1;
            building.position.set(side * (14 + Math.random() * 15), bHeight / 2, (i * 50) - 500);
            scene.add(building);
            buildings.push(building);
        }

        // Машина
        const carGeo = new THREE.BoxGeometry(1.6, 0.8, 3.5);
        const carMat = new THREE.MeshStandardMaterial({ color: 0xff0055, metalness: 0.8, roughness: 0.2 });
        const car = new THREE.Mesh(carGeo, carMat);
        car.position.set(0, 0.4, 0);
        scene.add(car);

        // Управление
        let moveLeft = false;
        let moveRight = false;

        document.getElementById('left').addEventListener('touchstart', (e) => { e.preventDefault(); moveLeft = true; });
        document.getElementById('left').addEventListener('touchend', () => moveLeft = false);
        document.getElementById('right').addEventListener('touchstart', (e) => { e.preventDefault(); moveRight = true; });
        document.getElementById('right').addEventListener('touchend', () => moveRight = false);
        document.getElementById('nitro').addEventListener('touchstart', (e) => { e.preventDefault(); isNitro = true; });
        document.getElementById('nitro').addEventListener('touchend', () => isNitro = false);

        // Кнопки меню
        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('gameover-screen').style.display = 'none';
            document.getElementById('ui').style.display = 'block';
            document.getElementById('controls').style.display = 'flex';
            
            score = 0;
            car.position.set(0, 0.4, 0);
            gameActive = true;
        }

        function gameOver() {
            gameActive = false;
            document.getElementById('ui').style.display = 'none';
            document.getElementById('controls').style.display = 'none';
            document.getElementById('final-score').innerText = score;
            document.getElementById('gameover-screen').style.display = 'flex';

            // Отправляем результат боту
            tg.sendData(JSON.stringify({ score: score, coins: coins }));
        }

        // Игровой цикл
        function animate() {
            requestAnimationFrame(animate);

            if (gameActive) {
                let currentSpeed = isNitro ? speed * 2.5 : speed;
                road.position.z -= currentSpeed;
                if (road.position.z < -1500) road.position.z = 0;

                buildings.forEach(b => {
                    b.position.z -= currentSpeed;
                    if (b.position.z < -500) b.position.z += 1500;
                });

                if (moveLeft && car.position.x > -9) car.position.x -= 0.25;
			if (moveRight && car.position.x < 9) car.position.x += 0.25;

                score += Math.floor(currentSpeed * 10);
                document.getElementById('score').innerText = score;

                // Проверка на столкновение со зданиями (если машина уедет слишком далеко вбок)
                if (Math.abs(car.position.x) > 8.5) {
                    gameOver();
                }

                camera.position.x = THREE.MathUtils.lerp(camera.position.x, car.position.x * 0.4, 0.1);
                camera.lookAt(car.position.x, car.position.y + 0.5, car.position.z + 6);
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
		</script>
	</body>
</html>
