<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D City Racing</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; user-select: none; }
        #ui { position: absolute; top: 10px; left: 10px; color: #fff; font-size: 18px; text-shadow: 1px 1px 2px #000; pointer-events: none; }
        #controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-around; padding: 0 20px; box-sizing: border-box; }
        .btn { width: 70px; height: 70px; background: rgba(255,255,255,0.2); border: 2px solid #fff; border-radius: 50%; color: #fff; font-size: 24px; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        #nitro-btn { background: rgba(255, 69, 0, 0.4); border-color: orange; }
    </style>
</head>
<body>
    <div id="ui">Очки: <span id="score">0</span><br>Монеты: <span id="coins">0</span></div>
    
    <div id="controls">
        <div class="btn" id="left">◀</div>
        <div class="btn" id="nitro">🔥</div>
        <div class="btn" id="right">▶</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let score = 0;
        let coins = 0;
        let speed = 0.5;
        let isNitro = false;

        // Сцена, камера, рендерер
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.FogExp2(0x050510, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, -10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Свет
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, -10);
        scene.add(dirLight);

        // Дорога
        const roadGeo = new THREE.PlaneGeometry(20, 2000);
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        scene.add(road);

        // Машина игрока
        const carGeo = new THREE.BoxGeometry(1.6, 0.8, 3.5);
        const carMat = new THREE.MeshStandardMaterial({ color: 0xff0055, metalness: 0.5 });
        const car = new THREE.Mesh(carGeo, carMat);
        car.position.set(0, 0.4, 0);
        scene.add(car);

        // Управление
        let moveLeft = false;
        let moveRight = false;

        document.getElementById('left').addEventListener('touchstart', () => moveLeft = true);
        document.getElementById('left').addEventListener('touchend', () => moveLeft = false);
        document.getElementById('right').addEventListener('touchstart', () => moveRight = true);
        document.getElementById('right').addEventListener('touchend', () => moveRight = false);
        
        const nitroBtn = document.getElementById('nitro');
        nitroBtn.addEventListener('touchstart', () => isNitro = true);
        nitroBtn.addEventListener('touchend', () => isNitro = false);

        // Игровой цикл
        function animate() {
            requestAnimationFrame(animate);

            let currentSpeed = isNitro ? speed * 2.5 : speed;
            road.position.z -= currentSpeed;
            if (road.position.z < -1000) road.position.z = 0;

            if (moveLeft && car.position.x > -8) car.position.x -= 0.2;
            if (moveRight && car.position.x < 8) car.position.x += 0.2;

            score += Math.floor(currentSpeed * 10);
            document.getElementById('score').innerText = score;

            // Камера следует за машиной
            camera.position.x = THREE.MathUtils.lerp(camera.position.x, car.position.x * 0.5, 0.1);
            camera.lookAt(car.position.x, car.position.y + 1, car.position.z + 5);

            renderer.render(scene, camera);
        }
        animate();

        // Отправка результатов боту при закрытии
        window.addEventListener('unload', () => {
            tg.sendData(JSON.stringify({ score: score, coins: coins }));
        });
    </script>
</body>
</html>
