<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
				<title>CITY RACER 3D</title>
				<script src="https://telegram.org/js/telegram-web-app.js"></script>
				<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
				<style>
					body { margin: 0; overflow: hidden; background: #050510; font-family: sans-serif; user-select: none; }
					#ui { position: absolute; top: 10px; left: 10px; color: #fff; font-size: 18px; text-shadow: 1px 1px 2px #000; pointer-events: none; z-index: 10; display: none; }
					#controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-around; padding: 0 20px; box-sizing: border-box; z-index: 10; display: none; }
					.btn { width: 70px; height: 70px; background: rgba(255,255,255,0.2); border: 2px solid #fff; border-radius: 50%; color: #fff; font-size: 24px; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
					#nitro { background: rgba(255, 69, 0, 0.4); border-color: orange; }

					.screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 5, 16, 0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; color: #fff; text-align: center; }
					.menu-btn { padding: 15px 40px; background: #ff4500; border: none; border-radius: 30px; color: #fff; font-size: 20px; font-weight: bold; cursor: pointer; margin-top: 20px; box-shadow: 0 0 15px rgba(255,69,0,0.6); }
					.menu-btn:active { transform: scale(0.95); }
					h1 { margin: 0 0 5px 0; font-size: 34px; letter-spacing: 2px; color: #ff4500; text-shadow: 0 0 12px rgba(255,69,0,0.8); }
					p { color: #aaa; font-size: 15px; }
					.author { margin-top: 15px; font-size: 12px; color: #00ffff; letter-spacing: 3px; text-transform: uppercase; }
				</style>
			</head>
	<body>
		<div id="start-screen" class="screen">
			<h1>CITY RACER 3D</h1>
			<p>Управление: A / D или Стрелки (Пробел — Нитро)</p>
			<button class="menu-btn" id="start-btn">СТАРТ</button>
			<div class="author">BY KATLETA0806</div>
		</div>

		<div id="gameover-screen" class="screen" style="display: none;">
			<h1>ЗАЕЗД ОКОНЧЕН</h1>
			<p>
				Счет: <span id="final-score">0</span>
			</p>
			<button class="menu-btn" id="restart-btn">ИГРАТЬ СНОВА</button>
		</div>

		<div id="ui">
			Очки: <span id="score">0</span><br>
				Монеты: <span id="coins">0</span>
		</div>

		<div id="controls">
			<div class="btn" id="left">◀</div>
			<div class="btn" id="nitro">🔥</div>
			<div class="btn" id="right">▶</div>
		</div>

		<script>
			const tg = window.Telegram.WebApp;
			tg.expand();

			let score = 0;
			let coins = 0;
			let baseSpeed = 0.25;
			let currentSpeed = 0.25;
			let isNitro = false;
			let gameActive = false;
			let carAngle = 0;
			let currentTurn = 0;

			const scene = new THREE.Scene();
			scene.background = new THREE.Color(0x050510);
			scene.fog = new THREE.FogExp2(0x050510, 0.02);

			const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
			const renderer = new THREE.WebGLRenderer({ antialias: true });
			renderer.setSize(window.innerWidth, window.innerHeight);
			document.body.appendChild(renderer.domElement);

			scene.add(new THREE.AmbientLight(0xffffff, 0.7));
			const dirLight = new THREE.DirectionalLight(0xffaa00, 1.0);
			dirLight.position.set(15, 25, -15);
			scene.add(dirLight);

			// Площадка
			const arenaSize = 150;
			const ground = new THREE.Mesh(
			new THREE.PlaneGeometry(arenaSize, arenaSize),
			new THREE.MeshStandardMaterial({ color: 0x111118, roughness: 0.9 })
			);
			ground.rotation.x = -Math.PI / 2;
			scene.add(ground);

			// ==========================================
			//  ОБЪЕМНЫЙ ОРАНЖЕВЫЙ ГИПЕРКАР
			// ==========================================
			const carGroup = new THREE.Group();

			const carPaintMat = new THREE.MeshStandardMaterial({ color: 0xff3b00, metalness: 0.8, roughness: 0.2 });
			const darkMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0c, roughness: 0.4 });
			const glassMat = new THREE.MeshStandardMaterial({ color: 0x111122, metalness: 0.9, roughness: 0.1 });
			const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

			// Нижняя база (основание кузова)
			const base = new THREE.Mesh(
			new THREE.BoxGeometry(1.8, 0.4, 3.8),
			carPaintMat
			);
			base.position.set(0, 0.3, 0);
			carGroup.add(base);

			// Массивный задний блок (моторный отсек)
			const rearEngine = new THREE.Mesh(
			new THREE.BoxGeometry(1.7, 0.5, 1.8),
			carPaintMat
			);
			rearEngine.position.set(0, 0.65, -0.7);
			carGroup.add(rearEngine);

			// Высокая кабина (крыша со стеклами)
			const cabin = new THREE.Mesh(
			new THREE.BoxGeometry(1.4, 0.55, 1.6),
			glassMat
			);
			cabin.position.set(0, 0.8, -0.1);
			carGroup.add(cabin);

			// Скошенный передний капот
			const hood = new THREE.Mesh(
			new THREE.BoxGeometry(1.7, 0.35, 1.4),
			carPaintMat
			);
			hood.position.set(0, 0.45, 1.1);
			carGroup.add(hood);

			// Спойлер сзади
			const spoiler = new THREE.Mesh(
			new THREE.BoxGeometry(1.7, 0.1, 0.5),
			darkMat
			);
			spoiler.position.set(0, 0.95, -1.6);
			carGroup.add(spoiler);

			const standL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.3, 0.1), darkMat);
			standL.position.set(-0.7, 0.75, -1.6);
			carGroup.add(standL);
			const standR = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.3, 0.1), darkMat);
			standR.position.set(0.7, 0.75, -1.6);
			carGroup.add(standR);

			// Фары
			const headLightL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, 0.15), lightMat);
			headLightL.position.set(-0.6, 0.4, 1.75);
			carGroup.add(headLightL);

			const headLightR = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, 0.15), lightMat);
			headLightR.position.set(0.6, 0.4, 1.75);
			carGroup.add(headLightR);

			// Колеса (крупные и объемные)
			const tireGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.25, 20);
			tireGeo.rotateZ(Math.PI / 2);
			const rimGeo = new THREE.CylinderGeometry(0.26, 0.26, 0.26, 10);
			rimGeo.rotateZ(Math.PI / 2);
			const rimMat = new THREE.MeshStandardMaterial({ color: 0x888899, metalness: 0.9, roughness: 0.1 });

			function createWheel() {
			const holder = new THREE.Group();
			holder.add(new THREE.Mesh(tireGeo, darkMat));
			holder.add(new THREE.Mesh(rimGeo, rimMat));
			return holder;
			}

			const frontLeftWheelPivot = new THREE.Group();
			frontLeftWheelPivot.position.set(-1.0, 0.3, 1.2);
			const wheelFL = createWheel();
			frontLeftWheelPivot.add(wheelFL);
			carGroup.add(frontLeftWheelPivot);

			const frontRightWheelPivot = new THREE.Group();
			frontRightWheelPivot.position.set(1.0, 0.3, 1.2);
			const wheelFR = createWheel();
			frontRightWheelPivot.add(wheelFR);
			carGroup.add(frontRightWheelPivot);

			const wheelBL = createWheel();
			wheelBL.position.set(-1.0, 0.3, -1.2);
			carGroup.add(wheelBL);

			const wheelBR = createWheel();
			wheelBR.position.set(1.0, 0.3, -1.2);
			carGroup.add(wheelBR);

			carGroup.position.set(0, 0, 0);
			scene.add(carGroup);

			// Управление
			let keyLeft = false;
			let keyRight = false;
			let btnLeft = false;
			let btnRight = false;

			window.addEventListener('keydown', (e) => {
			if (e.code === 'KeyA' || e.code === 'ArrowLeft') keyLeft = true;
			if (e.code === 'KeyD' || e.code === 'ArrowRight') keyRight = true;
			if (e.code === 'Space') isNitro = true;
			});

			window.addEventListener('keyup', (e) => {
			if (e.code === 'KeyA' || e.code === 'ArrowLeft') keyLeft = false;
			if (e.code === 'KeyD' || e.code === 'ArrowRight') keyRight = false;
			if (e.code === 'Space') isNitro = false;
			});

			const leftBtn = document.getElementById('left');
			const rightBtn = document.getElementById('right');
			const nitroBtn = document.getElementById('nitro');

			leftBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); btnLeft = true; });
			leftBtn.addEventListener('pointerup', () => btnLeft = false);
			leftBtn.addEventListener('pointercancel', () => btnLeft = false);
			leftBtn.addEventListener('pointerleave', () => btnLeft = false);

			rightBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); btnRight = true; });
			rightBtn.addEventListener('pointerup', () => btnRight = false);
			rightBtn.addEventListener('pointercancel', () => btnRight = false);
			rightBtn.addEventListener('pointerleave', () => btnRight = false);

			nitroBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); isNitro = true; });
			nitroBtn.addEventListener('pointerup', () => isNitro = false);
			nitroBtn.addEventListener('pointercancel', () => isNitro = false);
			nitroBtn.addEventListener('pointerleave', () => isNitro = false);

			document.getElementById('start-btn').addEventListener('pointerdown', startGame);
			document.getElementById('restart-btn').addEventListener('pointerdown', startGame);

			function startGame() {
			document.getElementById('start-screen').style.display = 'none';
			document.getElementById('gameover-screen').style.display = 'none';
			document.getElementById('ui').style.display = 'block';
			document.getElementById('controls').style.display = 'flex';

			score = 0;
			carGroup.position.set(0, 0, 0);
			carAngle = 0;
			currentTurn = 0;
			keyLeft = false;
			keyRight = false;
			btnLeft = false;
			btnRight = false;
			gameActive = true;
			}

			function gameOver() {
			gameActive = false;
			document.getElementById('ui').style.display = 'none';
			document.getElementById('controls').style.display = 'none';
			document.getElementById('final-score').innerText = score;
			document.getElementById('gameover-screen').style.display = 'flex';
			tg.sendData(JSON.stringify({ score: score, coins: coins }));
			}

			function animate() {
			requestAnimationFrame(animate);

			if (gameActive) {
			let targetSpeed = isNitro ? baseSpeed * 2.0 : baseSpeed;
			currentSpeed = THREE.MathUtils.lerp(currentSpeed, targetSpeed, 0.05);

			let targetTurn = 0;
			if (keyLeft || btnLeft) targetTurn = 1;
			if (keyRight || btnRight) targetTurn = -1;

			currentTurn = THREE.MathUtils.lerp(currentTurn, targetTurn, 0.1);

			carAngle += currentTurn * 0.035;
			carGroup.rotation.y = carAngle;
			carGroup.rotation.z = currentTurn * -0.12;

			let targetWheelRotation = currentTurn * 0.5;
			frontLeftWheelPivot.rotation.y = THREE.MathUtils.lerp(frontLeftWheelPivot.rotation.y, targetWheelRotation, 0.15);
			frontRightWheelPivot.rotation.y = THREE.MathUtils.lerp(frontRightWheelPivot.rotation.y, targetWheelRotation, 0.15);

			wheelFL.rotation.x -= currentSpeed * 2.5;
			wheelFR.rotation.x -= currentSpeed * 2.5;
			wheelBL.rotation.x -= currentSpeed * 2.5;
			wheelBR.rotation.x -= currentSpeed * 2.5;

			carGroup.position.x += Math.sin(carAngle) * currentSpeed;
			carGroup.position.z += Math.cos(carAngle) * currentSpeed;

			score += 1;
			document.getElementById('score').innerText = score;

			if (Math.abs(carGroup.position.x) > 70 || Math.abs(carGroup.position.z) > 70) {
			gameOver();
			}

			const camDist = 8.5;
			const camHeight = 3.5;
			let targetCamX = carGroup.position.x - Math.sin(carAngle) * camDist;
			let targetCamZ = carGroup.position.z - Math.cos(carAngle) * camDist;

			camera.position.x = THREE.MathUtils.lerp(camera.position.x, targetCamX, 0.1);
			camera.position.z = THREE.MathUtils.lerp(camera.position.z, targetCamZ, 0.1);
			camera.position.y = carGroup.position.y + camHeight;

			camera.lookAt(carGroup.position.x, carGroup.position.y + 0.5, carGroup.position.z);
			}

			renderer.render(scene, camera);
			}
			animate();

			window.addEventListener('resize', () => {
			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize(window.innerWidth, window.innerHeight);
			});
		</script>
	</body>
</html>
