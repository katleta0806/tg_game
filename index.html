<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
				<title>3D City Racing - Open Arena</title>
				<script src="https://telegram.org/js/telegram-web-app.js"></script>
				<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
				<style>
					body { margin: 0; overflow: hidden; background: #050510; font-family: sans-serif; user-select: none; }
					#ui { position: absolute; top: 10px; left: 10px; color: #fff; font-size: 18px; text-shadow: 1px 1px 2px #000; pointer-events: none; z-index: 10; display: none; }
					#controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-around; padding: 0 20px; box-sizing: border-box; z-index: 10; display: none; }
					.btn { width: 70px; height: 70px; background: rgba(255,255,255,0.2); border: 2px solid #fff; border-radius: 50%; color: #fff; font-size: 24px; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
					#nitro { background: rgba(255, 69, 0, 0.4); border-color: orange; }

					.screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 5, 16, 0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; color: #fff; text-align: center; }
					.menu-btn { padding: 15px 40px; background: #ff0055; border: none; border-radius: 30px; color: #fff; font-size: 20px; font-weight: bold; cursor: pointer; margin-top: 20px; box-shadow: 0 0 15px rgba(255,0,85,0.5); }
					.menu-btn:active { transform: scale(0.95); }
					h1 { margin: 0 0 10px 0; font-size: 32px; text-shadow: 0 0 10px #ff0055; }
					p { color: #aaa; font-size: 16px; }
				</style>
			</head>
	<body>
		<div id="start-screen" class="screen">
			<h1>CYBER ARENA</h1>
			<p>Свободная езда на спорткаре!</p>
			<p style="font-size: 14px; color: #ff0055;">Управление: A / D или Стрелки (Пробел — Нитро)</p>
			<button class="menu-btn" id="start-btn">СТАРТ</button>
		</div>

		<div id="gameover-screen" class="screen" style="display: none;">
			<h1>ЗАЕЗД ОКОНЧЕН</h1>
			<p>
				Счет: <span id="final-score">0</span>
			</p>
			<button class="menu-btn" id="restart-btn">ИГРАТЬ СНОВА</button>
		</div>

		<div id="ui">
			Очки: <span id="score">0</span><br>
				Монеты: <span id="coins">0</span>
		</div>

		<div id="controls">
			<div class="btn" id="left">◀</div>
			<div class="btn" id="nitro">🔥</div>
			<div class="btn" id="right">▶</div>
		</div>

		<script>
			const tg = window.Telegram.WebApp;
			tg.expand();

			let score = 0;
			let coins = 0;
			let speed = 0.4;
			let isNitro = false;
			let gameActive = false;
			let carAngle = 0;

			const scene = new THREE.Scene();
			scene.background = new THREE.Color(0x050510);
			scene.fog = new THREE.FogExp2(0x050510, 0.02);

			const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
			const renderer = new THREE.WebGLRenderer({ antialias: true });
			renderer.setSize(window.innerWidth, window.innerHeight);
			document.body.appendChild(renderer.domElement);

			scene.add(new THREE.AmbientLight(0xffffff, 0.6));
			const dirLight = new THREE.DirectionalLight(0x00ffff, 0.8);
			dirLight.position.set(10, 20, -10);
			scene.add(dirLight);

			// Площадка
			const arenaSize = 150;
			const ground = new THREE.Mesh(
			new THREE.PlaneGeometry(arenaSize, arenaSize),
			new THREE.MeshStandardMaterial({ color: 0x111118, roughness: 0.9 })
			);
			ground.rotation.x = -Math.PI / 2;
			scene.add(ground);

			// --- ДЕТАЛИЗИРОВАННАЯ МОДЕЛЬ МАШИНЫ ---
			const carGroup = new THREE.Group();

			// Основной кузов спорткара
			const body = new THREE.Mesh(
			new THREE.BoxGeometry(1.6, 0.4, 3.6),
			new THREE.MeshStandardMaterial({ color: 0xff0055, metalness: 0.8, roughness: 0.2 })
			);
			body.position.y = 0.3;
			carGroup.add(body);

			// Кабина (крыша)
			const cabin = new THREE.Mesh(
			new THREE.BoxGeometry(1.3, 0.4, 1.8),
			new THREE.MeshStandardMaterial({ color: 0x111118, roughness: 0.1, metalness: 0.5 })
			);
			cabin.position.set(0, 0.7, -0.2);
			carGroup.add(cabin);

			// Спойлер сзади
			const spoiler = new THREE.Mesh(
			new THREE.BoxGeometry(1.5, 0.08, 0.5),
			new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9 })
			);
			spoiler.position.set(0, 0.75, -1.6);
			carGroup.add(spoiler);

			// Стойки спойлера
			const spoilerStandMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
			const standLeft = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.2, 0.1), spoilerStandMat);
			standLeft.position.set(-0.6, 0.6, -1.6);
			carGroup.add(standLeft);
			const standRight = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.2, 0.1), spoilerStandMat);
			standRight.position.set(0.6, 0.6, -1.6);
			carGroup.add(standRight);

			// Фары (неоновые)
			const lightMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
			const lightLeft = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.1, 0.1), lightMat);
			lightLeft.position.set(-0.5, 0.3, 1.81);
			carGroup.add(lightLeft);
			const lightRight = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.1, 0.1), lightMat);
			lightRight.position.set(0.5, 0.3, 1.81);
			carGroup.add(lightRight);

			// Создаем колеса (цилиндры)
			const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.2, 16);
			wheelGeo.rotateZ(Math.PI / 2);
			const wheelMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 });

			// Передние колесные пивоты (для поворота руля)
			const frontLeftWheelPivot = new THREE.Group();
			frontLeftWheelPivot.position.set(-0.9, 0.25, 1.2);
			const wheelFL = new THREE.Mesh(wheelGeo, wheelMat);
			frontLeftWheelPivot.add(wheelFL);
			carGroup.add(frontLeftWheelPivot);

			const frontRightWheelPivot = new THREE.Group();
			frontRightWheelPivot.position.set(0.9, 0.25, 1.2);
			const wheelFR = new THREE.Mesh(wheelGeo, wheelMat);
			frontRightWheelPivot.add(wheelFR);
			carGroup.add(frontRightWheelPivot);

			// Задние колеса (статичные по повороту)
			const wheelBL = new THREE.Mesh(wheelGeo, wheelMat);
			wheelBL.position.set(-0.9, 0.25, -1.2);
			carGroup.add(wheelBL);

			const wheelBR = new THREE.Mesh(wheelGeo, wheelMat);
			wheelBR.position.set(0.9, 0.25, -1.2);
			carGroup.add(wheelBR);

			carGroup.position.set(0, 0, 0);
			scene.add(carGroup);

			// Флаги управления
			let keyLeft = false;
			let keyRight = false;
			let btnLeft = false;
			let btnRight = false;

			window.addEventListener('keydown', (e) => {
			if (e.code === 'KeyA' || e.code === 'ArrowLeft') keyLeft = true;
			if (e.code === 'KeyD' || e.code === 'ArrowRight') keyRight = true;
			if (e.code === 'Space') isNitro = true;
			});

			window.addEventListener('keyup', (e) => {
			if (e.code === 'KeyA' || e.code === 'ArrowLeft') keyLeft = false;
			if (e.code === 'KeyD' || e.code === 'ArrowRight') keyRight = false;
			if (e.code === 'Space') isNitro = false;
			});

			const leftBtn = document.getElementById('left');
			const rightBtn = document.getElementById('right');
			const nitroBtn = document.getElementById('nitro');

			leftBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); btnLeft = true; });
			leftBtn.addEventListener('pointerup', () => btnLeft = false);
			leftBtn.addEventListener('pointercancel', () => btnLeft = false);
			leftBtn.addEventListener('pointerleave', () => btnLeft = false);

			rightBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); btnRight = true; });
			rightBtn.addEventListener('pointerup', () => btnRight = false);
			rightBtn.addEventListener('pointercancel', () => btnRight = false);
			rightBtn.addEventListener('pointerleave', () => btnRight = false);

			nitroBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); isNitro = true; });
			nitroBtn.addEventListener('pointerup', () => isNitro = false);
			nitroBtn.addEventListener('pointercancel', () => isNitro = false);
			nitroBtn.addEventListener('pointerleave', () => isNitro = false);

			document.getElementById('start-btn').addEventListener('pointerdown', startGame);
			document.getElementById('restart-btn').addEventListener('pointerdown', startGame);

			function startGame() {
			document.getElementById('start-screen').style.display = 'none';
			document.getElementById('gameover-screen').style.display = 'none';
			document.getElementById('ui').style.display = 'block';
			document.getElementById('controls').style.display = 'flex';

			score = 0;
			carGroup.position.set(0, 0, 0);
			carAngle = 0;
			keyLeft = false;
			keyRight = false;
			btnLeft = false;
			btnRight = false;
			gameActive = true;
			}

			function gameOver() {
			gameActive = false;
			document.getElementById('ui').style.display = 'none';
			document.getElementById('controls').style.display = 'none';
			document.getElementById('final-score').innerText = score;
			document.getElementById('gameover-screen').style.display = 'flex';
			tg.sendData(JSON.stringify({ score: score, coins: coins }));
			}

			function animate() {
			requestAnimationFrame(animate);

			if (gameActive) {
			let currentSpeed = isNitro ? speed * 2.2 : speed;

			let turn = 0;
			if (keyLeft || btnLeft) turn = 1;
			if (keyRight || btnRight) turn = -1;

			carAngle += turn * 0.045;
			carGroup.rotation.y = carAngle;
			carGroup.rotation.z = turn * -0.15; // Наклон кузова

			// Плавный поворот передних колес в сторону руления
			let targetWheelRotation = turn * 0.6;
			frontLeftWheelPivot.rotation.y = THREE.MathUtils.lerp(frontLeftWheelPivot.rotation.y, targetWheelRotation, 0.2);
			frontRightWheelPivot.rotation.y = THREE.MathUtils.lerp(frontRightWheelPivot.rotation.y, targetWheelRotation, 0.2);

			// Вращение самих колес при движении
			wheelFL.rotation.x -= currentSpeed * 2;
			wheelFR.rotation.x -= currentSpeed * 2;
			wheelBL.rotation.x -= currentSpeed * 2;
			wheelBR.rotation.x -= currentSpeed * 2;

			// Движение вперед
			carGroup.position.x += Math.sin(carAngle) * currentSpeed;
			carGroup.position.z += Math.cos(carAngle) * currentSpeed;

			score += 1;
			document.getElementById('score').innerText = score;

			// Границы площадки
			if (Math.abs(carGroup.position.x) > 70 || Math.abs(carGroup.position.z) > 70) {
			gameOver();
			}

			// Камера сзади
			const camDist = 8;
			const camHeight = 3.5;
			camera.position.x = carGroup.position.x - Math.sin(carAngle) * camDist;
			camera.position.z = carGroup.position.z - Math.cos(carAngle) * camDist;
			camera.position.y = carGroup.position.y + camHeight;
			camera.lookAt(carGroup.position.x, carGroup.position.y + 0.5, carGroup.position.z);
			}

			renderer.render(scene, camera);
			}
			animate();

			window.addEventListener('resize', () => {
			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize(window.innerWidth, window.innerHeight);
			});
		</script>
	</body>
</html>
