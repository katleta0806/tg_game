<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
				<title>CITY RACER 3D</title>
				<script src="https://telegram.org/js/telegram-web-app.js"></script>
				<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
				<style>
					body { margin: 0; overflow: hidden; background: #050510; font-family: sans-serif; user-select: none; }
					#ui { position: absolute; top: 15px; left: 15px; color: #fff; font-size: 18px; text-shadow: 1px 1px 4px #000; pointer-events: none; z-index: 10; display: none; }
					#pause-btn { position: absolute; top: 15px; right: 15px; background: rgba(255, 69, 0, 0.4); border: 2px solid #ff4500; border-radius: 20px; color: #fff; padding: 8px 18px; font-size: 14px; font-weight: bold; cursor: pointer; backdrop-filter: blur(5px); z-index: 15; display: none; }
					#pause-btn:active { transform: scale(0.95); }

					#controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-around; padding: 0 20px; box-sizing: border-box; z-index: 10; display: none; }
					.btn { width: 70px; height: 70px; background: rgba(255,255,255,0.2); border: 2px solid #fff; border-radius: 50%; color: #fff; font-size: 24px; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
					#nitro { background: rgba(255, 69, 0, 0.4); border-color: orange; }

					.screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 5, 16, 0.88); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; color: #fff; text-align: center; }
					.menu-btn { padding: 15px 40px; background: #ff4500; border: none; border-radius: 30px; color: #fff; font-size: 20px; font-weight: bold; cursor: pointer; margin-top: 20px; box-shadow: 0 0 15px rgba(255,69,0,0.6); }
					.menu-btn:active { transform: scale(0.95); }
					h1 { margin: 0 0 5px 0; font-size: 34px; letter-spacing: 2px; color: #ff4500; text-shadow: 0 0 12px rgba(255,69,0,0.8); }
					p { color: #aaa; font-size: 14px; margin: 4px 0; }
					.author { margin-top: 15px; font-size: 12px; color: #00ffff; letter-spacing: 3px; text-transform: uppercase; }
				</style>
			</head>
	<body>
		<div id="start-screen" class="screen">
			<h1>CITY RACER 3D</h1>
			<p>Управление: A / D или Стрелки (Пробел — Нитро)</p>
			<p style="color: #ffaa00;">Зажми Влево + Вправо (A + D) для Заднего Хода!</p>
			<button class="menu-btn" id="start-btn">СТАРТ</button>
			<div class="author">BY KATLETA0806</div>
		</div>

		<div id="ui">
			Очки: <span id="score">0</span><br>
				Монеты: <span id="coins">0</span>
		</div>
		<button id="pause-btn">⏸ МЕНЮ</button>

		<div id="controls">
			<div class="btn" id="left">◀</div>
			<div class="btn" id="nitro">🔥</div>
			<div class="btn" id="right">▶</div>
		</div>

		<script>
			const tg = window.Telegram.WebApp;
			tg.expand();

			let score = 0;
			let coins = 0;
			let baseSpeed = 0.16; // Ещё более комфортная и плавная скорость
			let reverseSpeed = 0.08;
			let currentSpeed = 0.16;
			let isNitro = false;
			let gameActive = false;
			let carAngle = 0;
			let currentTurn = 0;

			const scene = new THREE.Scene();
			scene.background = new THREE.Color(0x050510);
			scene.fog = new THREE.FogExp2(0x050510, 0.018);

			const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
			const renderer = new THREE.WebGLRenderer({ antialias: true });
			renderer.setSize(window.innerWidth, window.innerHeight);
			document.body.appendChild(renderer.domElement);

			scene.add(new THREE.AmbientLight(0xffffff, 0.5));
			const dirLight = new THREE.DirectionalLight(0xffaa00, 0.8);
			dirLight.position.set(20, 40, -20);
			scene.add(dirLight);

			// ==========================================
			//  МАТЕРИАЛЫ И ОКРУЖЕНИЕ
			// ==========================================
			const darkMat = new THREE.MeshStandardMaterial({ color: 0x111115, roughness: 0.5 });
			const wallMat = new THREE.MeshStandardMaterial({ color: 0x1a1a24, roughness: 0.7 });
			const windowLitMat = new THREE.MeshBasicMaterial({ color: 0xffd700 });
			const windowDarkMat = new THREE.MeshStandardMaterial({ color: 0x0d0d15 });
			const roadMat = new THREE.MeshStandardMaterial({ color: 0x15151c, roughness: 0.8 });
			const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0x282832, roughness: 0.6 });

			const citySize = 160;
			const ground = new THREE.Mesh(new THREE.PlaneGeometry(citySize, citySize), roadMat);
			ground.rotation.x = -Math.PI / 2;
			scene.add(ground);

			// Массив хитбоксов для коллизий (здания и стены)
			const colliders = [];

			// Функция генерации зданий (2-3 этажа)
			function createBuilding(x, z, w, d, stories) {
			const storyHeight = 3.2;
			const h = stories * storyHeight;
			const bMesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
			bMesh.position.set(x, h / 2, z);
			scene.add(bMesh);

			// Окна
			for (let floor = 0; floor < stories; floor++) {
                for (let windowX = -w / 2 + 1; windowX < w / 2 - 0.5; windowX += 1.8) {
                    const isLit = Math.random() > 0.45;
                    const win = new THREE.Mesh(
                        new THREE.PlaneGeometry(0.8, 1.2),
                        isLit ? windowLitMat : windowDarkMat
                    );
                    win.position.set(x + windowX, floor * storyHeight + 2, z + d / 2 + 0.01);
                    scene.add(win);
                }
            }

            // Запоминаем для коллизий (AABB)
            colliders.push({
                minX: x - w / 2 - 0.9,
                maxX: x + w / 2 + 0.9,
                minZ: z - d / 2 - 0.9,
                maxZ: z + d / 2 + 0.9
            });
        }

        // --- СОЗДАНИЕ ВНУТРЕННИХ КВАРТАЛОВ (ЗДАНИЯ 2-3 ЭТАЖА) ---
        for (let bx = -50; bx <= 50; bx += 35) {
			for (let bz = -50; bz <= 50; bz += 35) {
			if (Math.abs(bx) < 15 && Math.abs(bz) < 15) continue; // Оставляем свободный спавн по центру
                const stories = Math.random() > 0.5 ? 2 : 3;
                createBuilding(bx, bz, 14, 14, stories);

                // Тротуары вокруг зданий
                const sidewalk = new THREE.Mesh(new THREE.BoxGeometry(18, 0.15, 18), sidewalkMat);
                sidewalk.position.set(bx, 0.07, bz);
                scene.add(sidewalk);
            }
        }

        // --- ВНЕШНИЙ ЗАБОР / ОГРАЖДЕНИЕ ИЗ СТЕН И ДОМОВ ПО ПЕРИМЕТРУ ---
        const boundLimit = 75;
        const wallThick = 4;
        const wallH = 10;

        // Северная и Южная стены
        const wallN = new THREE.Mesh(new THREE.BoxGeometry(citySize, wallH, wallThick), wallMat);
        wallN.position.set(0, wallH/2, boundLimit);
        scene.add(wallN);
        colliders.push({ minX: -boundLimit, maxX: boundLimit, minZ: boundLimit - 2, maxZ: boundLimit + 5 });

        const wallS = new THREE.Mesh(new THREE.BoxGeometry(citySize, wallH, wallThick), wallMat);
        wallS.position.set(0, wallH/2, -boundLimit);
        scene.add(wallS);
        colliders.push({ minX: -boundLimit, maxX: boundLimit, minZ: -boundLimit - 5, maxZ: -boundLimit + 2 });

        // Западная и Восточная стены
        const wallW = new THREE.Mesh(new THREE.BoxGeometry(wallThick, wallH, citySize), wallMat);
        wallW.position.set(-boundLimit, wallH/2, 0);
        scene.add(wallW);
        colliders.push({ minX: -boundLimit - 5, maxX: -boundLimit + 2, minZ: -boundLimit, maxZ: boundLimit });

        const wallE = new THREE.Mesh(new THREE.BoxGeometry(wallThick, wallH, citySize), wallMat);
        wallE.position.set(boundLimit, wallH/2, 0);
        scene.add(wallE);
        colliders.push({ minX: boundLimit - 2, maxX: boundLimit + 5, minZ: -boundLimit, maxZ: boundLimit });

        // Фонарные столбы освещения
        const lampMat = new THREE.MeshBasicMaterial({ color: 0xffaa33 });
        for (let lx = -60; lx <= 60; lx += 30) {
			for (let lz = -60; lz <= 60; lz += 30) {
			const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 4.5), darkMat);
			pole.position.set(lx + 10, 2.25, lz + 10);
			scene.add(pole);

			const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.3), lampMat);
			bulb.position.set(lx + 10, 4.5, lz + 10);
			scene.add(bulb);

			const pLight = new THREE.PointLight(0xffaa33, 0.7, 18);
			pLight.position.set(lx + 10, 4.3, lz + 10);
			scene.add(pLight);
			}
			}

			// ==========================================
			//  МОНЕТКИ
			// ==========================================
			const coinsList = [];
			const coinGeo = new THREE.CylinderGeometry(0.6, 0.6, 0.12, 16);
			coinGeo.rotateX(Math.PI / 2);
			const coinMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.9, roughness: 0.1 });

			function spawnCoins() {
			for (let i = 0; i < 20; i++) {
                const coin = new THREE.Mesh(coinGeo, coinMat);
                resetCoinPos(coin);
                scene.add(coin);
                coinsList.push(coin);
            }
        }

        function resetCoinPos(coin) {
            coin.position.x = (Math.random() - 0.5) * 120;
            coin.position.z = (Math.random() - 0.5) * 120;
            coin.position.y = 0.6;
        }
        spawnCoins();

        // ==========================================
        //  ОРАНЖЕВЫЙ СУПЕРКАР
        // ==========================================
        const carGroup = new THREE.Group();
        const carPaintMat = new THREE.MeshStandardMaterial({ color: 0xff3b00, metalness: 0.7, roughness: 0.2 });
        const glassMat = new THREE.MeshStandardMaterial({ color: 0x151828, metalness: 0.9, roughness: 0.1 });
        const lightHeadMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const lightTailMat = new THREE.MeshBasicMaterial({ color: 0xff0033 });
        const rimMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.9, roughness: 0.1 });

        const wheelY = 0.38;

        const bodyMain = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.45, 3.6), carPaintMat);
        bodyMain.position.set(0, wheelY + 0.1, 0);
        carGroup.add(bodyMain);

        const hood = new THREE.Mesh(new THREE.BoxGeometry(1.48, 0.22, 1.2), carPaintMat);
        hood.position.set(0, wheelY + 0.24, 1.0);
        hood.rotation.x = 0.08;
        carGroup.add(hood);

        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.48, 1.5), glassMat);
        cabin.position.set(0, wheelY + 0.5, -0.1);
        carGroup.add(cabin);

        const roof = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.06, 0.9), carPaintMat);
        roof.position.set(0, wheelY + 0.75, -0.15);
        carGroup.add(roof);

        const frontBumper = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.25, 0.3), darkMat);
        frontBumper.position.set(0, wheelY - 0.03, 1.8);
        carGroup.add(frontBumper);

        const lightL = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.08, 0.1), lightHeadMat);
        lightL.position.set(-0.5, wheelY + 0.17, 1.81);
        carGroup.add(lightL);
        const lightR = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.08, 0.1), lightHeadMat);
        lightR.position.set(0.5, wheelY + 0.17, 1.81);
        carGroup.add(lightR);

        const rearBumper = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.3, 0.2), darkMat);
        rearBumper.position.set(0, wheelY + 0.07, -1.8);
        carGroup.add(rearBumper);

        const tailL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.08, 0.1), lightTailMat);
        tailL.position.set(-0.45, wheelY + 0.22, -1.86);
        carGroup.add(tailL);
        const tailR = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.08, 0.1), lightTailMat);
        tailR.position.set(0.45, wheelY + 0.22, -1.86);
        carGroup.add(tailR);

        const spoilerWing = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.06, 0.4), darkMat);
        spoilerWing.position.set(0, wheelY + 0.64, -1.65);
        carGroup.add(spoilerWing);

        const standL = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.25, 0.08), darkMat);
        standL.position.set(-0.55, wheelY + 0.49, -1.65);
        carGroup.add(standL);
        const standR = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.25, 0.08), darkMat);
        standR.position.set(0.55, wheelY + 0.49, -1.65);
        carGroup.add(standR);

        const tireGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.22, 20);
        tireGeo.rotateZ(Math.PI / 2);

        function createWheel() {
            const holder = new THREE.Group();
            holder.add(new THREE.Mesh(tireGeo, darkMat));
            const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.23, 10), rimMat);
            rim.rotateZ(Math.PI / 2);
            holder.add(rim);
            return holder;
        }

        const frontLeftWheelPivot = new THREE.Group();
        frontLeftWheelPivot.position.set(-0.92, wheelY, 1.15);
        const wheelFL = createWheel();
        frontLeftWheelPivot.add(wheelFL);
        carGroup.add(frontLeftWheelPivot);

        const frontRightWheelPivot = new THREE.Group();
        frontRightWheelPivot.position.set(0.92, wheelY, 1.15);
        const wheelFR = createWheel();
        frontRightWheelPivot.add(wheelFR);
        carGroup.add(frontRightWheelPivot);

        const wheelBL = createWheel();
        wheelBL.position.set(-0.92, wheelY, -1.15);
        carGroup.add(wheelBL);

        const wheelBR = createWheel();
        wheelBR.position.set(0.92, wheelY, -1.15);
        carGroup.add(wheelBR);

        carGroup.position.set(0, 0, 0);
        scene.add(carGroup);

        // ==========================================
        //  УПРАВЛЕНИЕ И ЛОГИКА
        // ==========================================
        let keyLeft = false;
        let keyRight = false;
        let btnLeft = false;
        let btnRight = false;

        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') keyLeft = true;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') keyRight = true;
            if (e.code === 'Space') isNitro = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') keyLeft = false;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') keyRight = false;
            if (e.code === 'Space') isNitro = false;
        });

        const leftBtn = document.getElementById('left');
        const rightBtn = document.getElementById('right');
        const nitroBtn = document.getElementById('nitro');

        leftBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); btnLeft = true; });
        leftBtn.addEventListener('pointerup', () => btnLeft = false);
        leftBtn.addEventListener('pointercancel', () => btnLeft = false);
        leftBtn.addEventListener('pointerleave', () => btnLeft = false);

        rightBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); btnRight = true; });
        rightBtn.addEventListener('pointerup', () => btnRight = false);
        rightBtn.addEventListener('pointercancel', () => btnRight = false);
        rightBtn.addEventListener('pointerleave', () => btnRight = false);

        nitroBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); isNitro = true; });
        nitroBtn.addEventListener('pointerup', () => isNitro = false);
        nitroBtn.addEventListener('pointercancel', () => isNitro = false);
        nitroBtn.addEventListener('pointerleave', () => isNitro = false);

        document.getElementById('start-btn').addEventListener('pointerdown', startGame);
        document.getElementById('pause-btn').addEventListener('pointerdown', returnToMenu);

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('ui').style.display = 'block';
            document.getElementById('pause-btn').style.display = 'block';
            document.getElementById('controls').style.display = 'flex';
            
            score = 0;
            carGroup.position.set(0, 0, 0);
            carAngle = 0;
            currentTurn = 0;
            keyLeft = false;
            keyRight = false;
            btnLeft = false;
            btnRight = false;
            gameActive = true;
        }

        function returnToMenu() {
            gameActive = false;
            document.getElementById('ui').style.display = 'none';
            document.getElementById('pause-btn').style.display = 'none';
            document.getElementById('controls').style.display = 'none';
            document.getElementById('start-screen').style.display = 'flex';
            tg.sendData(JSON.stringify({ score: score, coins: coins }));
        }

        // Проверка столкновения со зданиями и стенами
        function checkCollisions(nextX, nextZ) {
            for (let c of colliders) {
                if (nextX > c.minX && nextX < c.maxX && nextZ > c.minZ && nextZ < c.maxZ) {
                    return true; // Врезались в стену или здание
                }
            }
            return false;
        }

        function animate() {
            requestAnimationFrame(animate);

            // Анимация вращения монеток
            coinsList.forEach(coin => {
                coin.rotation.z += 0.03;
            });

            if (gameActive) {
                const isLeft = keyLeft || btnLeft;
                const isRight = keyRight || btnRight;

                let isReversing = isLeft && isRight; // ЗАДНИЙ ХОД ПРИ НАЖАТИИ ОБОИХ КНОПОК

			let targetSpeed = 0;
			let targetTurn = 0;

			if (isReversing) {
			targetSpeed = -reverseSpeed;
			targetTurn = 0; // Прямые колеса при заднем ходе
			} else {
			targetSpeed = isNitro ? baseSpeed * 1.9 : baseSpeed;
			if (isLeft) targetTurn = 1;
			if (isRight) targetTurn = -1;
			}

			currentSpeed = THREE.MathUtils.lerp(currentSpeed, targetSpeed, 0.08);
			currentTurn = THREE.MathUtils.lerp(currentTurn, targetTurn, 0.1);

			// Поворот угла машины
			if (Math.abs(currentSpeed) > 0.01) {
			const dir = currentSpeed > 0 ? 1 : -1;
			carAngle += currentTurn * 0.035 * dir;
			}

			carGroup.rotation.y = carAngle;
			carGroup.rotation.z = currentTurn * -0.12;

			// Рулевые колеса
			let targetWheelRotation = currentTurn * 0.45;
			frontLeftWheelPivot.rotation.y = THREE.MathUtils.lerp(frontLeftWheelPivot.rotation.y, targetWheelRotation, 0.15);
			frontRightWheelPivot.rotation.y = THREE.MathUtils.lerp(frontRightWheelPivot.rotation.y, targetWheelRotation, 0.15);

			// Вращение колес
			wheelFL.rotation.x -= currentSpeed * 2.5;
			wheelFR.rotation.x -= currentSpeed * 2.5;
			wheelBL.rotation.x -= currentSpeed * 2.5;
			wheelBR.rotation.x -= currentSpeed * 2.5;

			// Проверка следующей позиции на коллизии
			let nextX = carGroup.position.x + Math.sin(carAngle) * currentSpeed;
			let nextZ = carGroup.position.z + Math.cos(carAngle) * currentSpeed;

			if (!checkCollisions(nextX, nextZ)) {
			carGroup.position.x = nextX;
			carGroup.position.z = nextZ;
			} else {
			currentSpeed = 0; // Останавливаем при ударе об стену
			}

			// Сбор монеток
			coinsList.forEach(coin => {
			const dist = carGroup.position.distanceTo(coin.position);
			if (dist < 1.8) {
                        coins += 1;
                        document.getElementById('coins').innerText = coins;
                        resetCoinPos(coin);
                    }
                });

                score += 1;
                document.getElementById('score').innerText = score;

                // Слежение камеры за машиной
                const camDist = 8.5;
                const camHeight = 3.5;
                let targetCamX = carGroup.position.x - Math.sin(carAngle) * camDist;
                let targetCamZ = carGroup.position.z - Math.cos(carAngle) * camDist;

                camera.position.x = THREE.MathUtils.lerp(camera.position.x, targetCamX, 0.1);
                camera.position.z = THREE.MathUtils.lerp(camera.position.z, targetCamZ, 0.1);
                camera.position.y = carGroup.position.y + camHeight;
                
                camera.lookAt(carGroup.position.x, carGroup.position.y + 0.5, carGroup.position.z);
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
		</script>
	</body>
</html>
